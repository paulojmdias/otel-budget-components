# Divert to cold storage at tier 2. The budget processor stamps otelcol.budget.divert,
# the routing connector moves those resources to the cold pipeline, and
# budget/cold accounts them at cold prices.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 512, spike_limit_mib: 128 }
  budget: { ledger: budget }
  budget/cold: { ledger: budget, price_class: cold, enforce: false }
exporters:
  otlp_http/loki: { endpoint: http://loki:3100/otlp, sending_queue: { batch: { flush_timeout: 1s } } }
  file/cold: { path: /var/lib/otelcol/cold/logs.jsonl }
connectors:
  routing:
    default_pipelines: [logs/hot]
    table:
      - context: resource
        condition: attributes["otelcol.budget.divert"] == true
        pipelines: [logs/cold]
extensions:
  budget:
    prices:
      hot:  { logs_gb: 0.40 }
      cold: { logs_gb: 0.02 }
    budgets: [{ name: default, match: default, budget: 100 }]
    tiers:
      - { threshold: 1.0, actions: { drop_below_severity: INFO, sample_ratio: 0.5 } }
      - { threshold: 2.0, actions: { divert: true } }
service:
  extensions: [budget]
  pipelines:
    logs/in:   { receivers: [otlp], processors: [memory_limiter, budget], exporters: [routing] }
    logs/hot:  { receivers: [routing], exporters: [otlp_http/loki] }
    logs/cold: { receivers: [routing], processors: [budget/cold], exporters: [file/cold] }
