# Metrics priced per data point and per active series hour; tiers drop metric
# families by name glob.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 512, spike_limit_mib: 128 }
  budget: { ledger: budget }
exporters:
  debug: { verbosity: basic, sending_queue: { batch: { flush_timeout: 1s } } }
extensions:
  budget:
    prices: { hot: { metrics_million_points: 0.10, series_hour: 0.00001 } }
    budgets: [{ name: default, match: default, budget: 100 }]
    tiers:
      - { threshold: 1.0, actions: { drop_metrics: ["*_bucket", "go_*", "process_*"] } }
      - { threshold: 2.0, actions: { drop_metrics: ["*_bucket", "go_*", "process_*", "http_client_*"] } }
service:
  extensions: [budget]
  pipelines:
    metrics: { receivers: [otlp], processors: [memory_limiter, budget], exporters: [debug] }
